<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人首頁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: "Microsoft JhengHei", sans-serif;
            color: white;
            overflow: hidden;
        }

        /* 背景圖全螢幕 */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('myphoto.jpg') center center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 半透明遮罩（讓文字更清晰） */
        .hero::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 5em;
            font-weight: 900;
            letter-spacing: 5px;
        }

        p {
            margin-top: 10px;
            font-size: 1.2em;
        }

        /* 作品連結區 */
        .works {
            position: absolute;
            bottom: 40px;
            z-index: 2;
            text-align: center;
        }

        .works a {
            display: inline-block;
            margin: 0 15px;
            color: white;
            font-size: 1.1em;
            text-decoration: none;
            border: 1px solid white;
            padding: 8px 16px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .works a:hover {
            background-color: white;
            color: black;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3em;
            }
            .works a {
                display: block;
                margin: 10px auto;
                width: 60%;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <h1>我的名字</h1>
            <p>關於美學、創作與生活的故事</p>
        </div>

        <div class="works">
            <a href="work1.pdf" target="_blank">作品一</a>
            <a href="work2.pdf" target="_blank">作品二</a>
            <a href="work3.pdf" target="_blank">作品三</a>
        </div>
    </div>
</body>
</html>
